dependencies {
    api project(':jmcomic-api')

    // 与 picapi 保持完全一致的核心依赖
    api 'com.squareup.okhttp3:okhttp:5.5.0'
    api 'com.squareup.okhttp3:logging-interceptor:5.5.0'
    // OkHttp 5.x 起 JavaNetCookieJar 拆分为独立构件（旧 okhttp-urlconnection 4.x 与 OkHttp 5 混用会引发运行时类冲突）
    api 'com.squareup.okhttp3:okhttp-java-net-cookiejar:5.5.0'
    api 'com.google.code.gson:gson:2.10.1'

    // JMComic 核心依赖
    api 'org.apache.commons:commons-lang3:3.16.0'
    api 'org.jsoup:jsoup:1.17.2'
    api 'io.github.darkxanter:webp-imageio:0.3.3'
    api 'org.slf4j:slf4j-api:2.0.12'

    testImplementation 'org.slf4j:slf4j-simple:2.0.12'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.squareup.okhttp3:mockwebserver3:5.5.0'
}
